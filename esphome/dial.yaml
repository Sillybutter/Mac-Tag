        - lvgl.page.show: { id: main_menu_page, animation: OVER_RIGHT, time: 240ms }
      on_load:
        - lambda: 'id(current_page) = 3;'
        - lvgl.label.update:
            id: thermostat_target_label
            text: !lambda |-
              static char buf[16];
              snprintf(buf, sizeof(buf), "%.0f\xc2\xb0", id(thermostat_target));
              return buf;
        - lvgl.label.update:
            id: thermostat_current_label
            text: !lambda |-
              static char buf[24];
              snprintf(buf, sizeof(buf), "Currently %.0f\xc2\xb0""F", id(thermostat_current));
              return buf;
      widgets:
        - button: { id: thermo_glow_1, align: CENTER, width: 470, height: 470, radius: 235, clickable: false, bg_color: 0x060606, border_width: 0, shadow_width: 0 }
        - button: { id: thermo_glow_2, align: CENTER, width: 460, height: 460, radius: 230, clickable: false, bg_color: 0x0A0A0B, border_width: 0, shadow_width: 0 }
        - button: { id: thermo_glow_3, align: CENTER, width: 450, height: 450, radius: 225, clickable: false, bg_color: 0x0F0F11, border_width: 0, shadow_width: 0 }
        - button:
