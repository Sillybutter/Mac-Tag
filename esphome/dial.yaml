# ============================================================
#  ESPHome — Elecrow CrowPanel 2.1" Rotary Display
#  Theme: Per-Room Color Coded / Material You Dark
#  Menu: Music, TV, Light, Thermostat
# ============================================================

esphome:
  name: dial
  friendly_name: dial
  includes:
    - dial_playlists.h
    - dial_chill.h
  compile_process_limit: 1
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM -g0 --param ggc-min-expand=10 --param ggc-min-heapsize=32768"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - output.turn_on: lcd_power
      - output.turn_on: display_reset
      - delay: 100ms
      - output.turn_off: display_reset
      - delay: 100ms
      - output.turn_on: tp_reset
      - delay: 100ms
      - output.turn_off: tp_reset
      - delay: 120ms
      - output.turn_on: tp_reset
      - delay: 120ms
      - script.execute: screen_idle_timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: !secret dial_api_key
  on_client_connected:
    - lvgl.page.show:
        id: main_menu_page
        animation: OVER_LEFT
        time: 240ms
    - lambda: 'id(current_page) = 0;'
  on_client_disconnected:
    - lvgl.page.show:
        id: connecting_page
        animation: FADE_IN
        time: 240ms
    - lambda: 'id(current_page) = -1;'

ota:
  - platform: esphome
    password: !secret dial_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Dial Fallback Hotspot"
    password: !secret dial_ap_password

captive_portal:

# ================= TIME SERVER =================
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: /1
        then:
          - if:
              condition:
                lambda: 'return id(current_page) == 7;'
              then:
                - lvgl.label.update:
                    id: clock_label
                    text: !lambda |-
                      auto time = id(ha_time).now();
                      if (time.is_valid()) {
                        return time.strftime("%I:%M");
                      }
                      return std::string("--:--");
                - lvgl.label.update:
                    id: clock_ampm
                    text: !lambda |-
                      auto time = id(ha_time).now();
                      if (time.is_valid()) {
                        return time.strftime("%p");
                      }
                      return std::string("");
                - lvgl.label.update:
                    id: date_label
                    text: !lambda |-
                      auto time = id(ha_time).now();
                      if (time.is_valid()) {
                        return time.strftime("%A, %B %d");
                      }
                      return std::string("");

i2c:
  sda: 38
  scl: 39
  id: bus_a
  scan: true

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: bus_a
    address: 0x15
    update_interval: 50ms
    skip_probe: true
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      then:
        - lambda: 'id(last_user_touch) = millis();'
        - if:
            condition:
              lambda: 'return id(current_page) == 7;'
            then:
              - script.execute: wake_from_clock
            else:
              - script.execute: screen_idle_timer

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode:
        output: true
      inverted: false
  - platform: gpio
    id: tp_reset
    pin:
      pcf8574: pcf
      number: 0
      mode:
        output: true
  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode:
        output: true
      inverted: true

spi:
  clk_pin: 2
  mosi_pin: 1

# ================= DISPLAY =================
display:
  - platform: st7701s
    id: rgb_panel
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 16
    de_pin: 40
    hsync_pin: 15
    vsync_pin: 7
    pclk_pin: 41
    data_pins:
      red:   [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue:  [5, 45, 48, 47, 21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_inverted: true
    pclk_frequency: 18MHz
    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    output: bl_pwm
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

# ================= GLOBALS =================
globals:
  - id: current_page
    type: int
    initial_value: '0'
  - id: timer_count_prev
    type: int
    initial_value: '0'
  - id: menu_index
    type: int
    initial_value: '0'
  - id: lights_menu_index
    type: int
    initial_value: '0'
  - id: spotlights_menu_index
    type: int
    initial_value: '0'
  - id: tv_menu_index
    type: int
    initial_value: '0'
  - id: scene_ui_index
    type: int
    initial_value: '0'
  - id: volume_value
    type: int
    initial_value: '50'
  - id: ha_vol_raw
    type: int
    initial_value: '-1'
  - id: ha_brightness_raw
    type: int
    initial_value: '-1'
  - id: ha_therm_target_raw
    type: float
    initial_value: '-1000.0'
  - id: ha_vol_ms
    type: uint32_t
    initial_value: '0'
  - id: ha_bri_ms
    type: uint32_t
    initial_value: '0'
  - id: ha_therm_ms
    type: uint32_t
    initial_value: '0'
  - id: knob_vol_ms
    type: uint32_t
    initial_value: '0'

  # Encoder clicks waiting to be handled by the 20 ms knob interval:
  - id: knob_raw_pending
    type: int
    initial_value: '0'

  - id: knob_bri_ms
    type: uint32_t
    initial_value: '0'
  - id: knob_therm_ms
    type: uint32_t
    initial_value: '0'
  - id: vol_sent_ms
    type: uint32_t
    initial_value: '0'
  - id: vol_last_sent
    type: int
    initial_value: '-1'
  - id: brightness_value
    type: int
    initial_value: '0'
  - id: lights_on
    type: bool
    initial_value: 'false'
  - id: thermostat_target
    type: float
    initial_value: '70.0'
  - id: thermostat_current
    type: float
    initial_value: '70.0'
  - id: knob_active
    type: bool
    initial_value: 'false'
  - id: music_artist_ms
    type: uint32_t
    initial_value: '0'
  - id: artist_stale
    type: bool
    initial_value: 'true'
  - id: tv_vol_steps
    type: int
    initial_value: '0'
  - id: tv_vol_fire
    type: bool
    initial_value: 'false'
  - id: tv_seek_last_ms
    type: uint32_t
    initial_value: '0'
  - id: tv_seek_multiplier
    type: int
    initial_value: '1'
  - id: accent_brightness_value
    type: int
    initial_value: '50'
  - id: playlist_index
    type: int
    initial_value: '0'
  - id: chill_index
    type: int
    initial_value: '0'
  - id: last_user_touch
    type: uint32_t
    initial_value: '0'
  - id: art_retry
    type: int
    initial_value: '0'
  - id: tv_art_retry
    type: int
    initial_value: '0'
  - id: accent_on
    type: bool
    initial_value: 'false'
  - id: long_press_fired
    type: bool
    initial_value: 'false'
  - id: wake_consumed
    type: bool
    initial_value: 'false'
  - id: sleep_minutes
    type: int
    initial_value: '0'
  - id: sleep_active
    type: bool
    initial_value: 'false'
  - id: frigate_seeded
    type: bool
    initial_value: 'false'
  - id: last_alert_ms
    type: uint32_t
    initial_value: '0'

# ================= ALBUM ART =================
http_request:
  id: http_req
  verify_ssl: false
  timeout: 10s

online_image:
  - id: album_art
    url: "http://192.168.4.195:8123/"
    format: JPEG
    type: RGB565
    resize: 480x480
    update_interval: never
    on_download_finished:
      - lambda: 'id(art_retry) = 0;'
      - lvgl.image.update:
          id: music_art
          src: album_art
      - lvgl.widget.show: music_art
    on_error:
      - lvgl.widget.hide: music_art
      - if:
          condition:
            lambda: 'return id(art_retry) < 3;'
          then:
            - lambda: 'id(art_retry) += 1;'
            - script.execute: music_art_retry

  - id: tv_art
    url: "http://192.168.4.195:8123/"
    format: PNG
    type: RGB565
    resize: 854x480
    update_interval: never
    on_download_finished:
      - lambda: 'id(tv_art_retry) = 0;'
      - lvgl.image.update:
          id: tv_art_img
          src: tv_art
      - lvgl.widget.show: tv_art_img
    on_error:
      - lvgl.widget.hide: tv_art_img
      - if:
          condition:
            lambda: 'return id(tv_art_retry) < 3;'
          then:
            - lambda: 'id(tv_art_retry) += 1;'
            - script.execute: tv_art_retry_script

  - id: yt_thumb
    url: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
    format: JPEG
    type: RGB565
    resize: 640x480
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: tv_art_img
          src: yt_thumb
      - lvgl.widget.show: tv_art_img
    on_error:
      - script.execute: tv_screencap_refresh

# ================= SENSORS =================
sensor:
  - platform: homeassistant
    id: ha_timer_count
    entity_id: sensor.voice_timers_summary
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x > 0.5f && id(timer_count_prev) == 0 && id(current_page) != 16;'
          then:
            - lvgl.page.show:
                id: timer_page
                animation: FADE_IN
                time: 200ms
            - light.turn_on:
                id: lcd_backlight
                brightness: 100%
      - if:
          condition:
            lambda: 'return x < 0.5f && id(current_page) == 16;'
          then:
            - script.execute: wake_from_clock
      - lambda: 'id(timer_count_prev) = (int) (x + 0.5f);'

  - platform: homeassistant
    id: ha_media_volume
    entity_id: media_player.living_room_speakers_3
    attribute: volume_level
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x)) {
            int incoming = int(x * 100.0f + 0.5f);
            if (incoming < 0) incoming = 0;
            if (incoming > 100) incoming = 100;

            uint32_t now = millis();
            id(ha_vol_raw) = incoming;
            id(ha_vol_ms) = now;

            bool music_page = id(current_page) == 2 || id(current_page) == 11;
            bool recent_knob = id(knob_vol_ms) != 0 &&
                               (uint32_t)(now - id(knob_vol_ms)) < 30000UL;
            bool suppress = music_page && recent_knob;

            if (!suppress) {
              id(volume_value) = incoming;
            }
          }
      - if:
          condition:
            lambda: |-
              uint32_t now = millis();
              bool music_page = id(current_page) == 2 || id(current_page) == 11;
              bool recent_knob = id(knob_vol_ms) != 0 &&
                                 (uint32_t)(now - id(knob_vol_ms)) < 30000UL;
              return !(music_page && recent_knob);
          then:
            - lvgl.label.update:
                id: volume_display
                text: !lambda |-
                  static char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", id(volume_value));
                  return buf;
            - lvgl.arc.update:
                id: volume_arc
                value: !lambda 'return id(volume_value);'

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: light.living_room_main_lights
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x)) {
            id(ha_brightness_raw) = int((x / 255.0f) * 100.0f + 0.5f);
            id(ha_bri_ms) = millis();
            if (!id(knob_active)) id(brightness_value) = id(ha_brightness_raw);
          }
      - if:
          condition:
            lambda: 'return !id(knob_active);'
          then:
            - lvgl.label.update:
                id: brightness_value_label
                text: !lambda |-
                  static char buf[16];
                  snprintf(buf, sizeof(buf), "%d%%", id(brightness_value));
                  return buf;
            - lvgl.arc.update:
                id: brightness_arc
                value: !lambda 'return id(brightness_value);'

  - platform: homeassistant
    id: ha_thermostat_current
    entity_id: climate.living_room_thermostat
    attribute: current_temperature
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x)) {
            id(thermostat_current) = x;
          }
      - lvgl.label.update:
          id: thermostat_current_label
          text: !lambda |-
            static char buf[24];
            snprintf(buf, sizeof(buf), "Currently %.0f\xc2\xb0""F", id(thermostat_current));
            return buf;
      - lvgl.label.update:
          id: main_menu_top
          text: !lambda |-
            static char buf[32];
            snprintf(buf, sizeof(buf), "Home  \xc2\xb7  Inside %.0f\xc2\xb0", id(thermostat_current));
            return buf;
      - script.execute: update_clock_status

  - platform: homeassistant
    id: ha_weather_temp
    entity_id: weather.forecast_home_3
    attribute: temperature
    internal: true
    on_value:
      - script.execute: update_clock_status

  - platform: homeassistant
    id: ha_thermostat_target
    entity_id: climate.living_room_thermostat
    attribute: temperature
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x)) {
            id(ha_therm_target_raw) = x;
            id(ha_therm_ms) = millis();
            if (!id(knob_active)) id(thermostat_target) = x;
          }
      - if:
          condition:
            lambda: 'return !id(knob_active);'
          then:
            - lvgl.label.update:
                id: thermostat_target_label
                text: !lambda |-
                  static char buf[16];
                  snprintf(buf, sizeof(buf), "%.0f\xc2\xb0", id(thermostat_target));
                  return buf;

  # --- Rotary encoder: one count per detent click on this knob ---
  # If every other click is ignored, change resolution to 2.
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: 4
      mode:
        input: true
        pullup: true
    pin_b:
      number: 42
      mode:
        input: true
        pullup: true
    resolution: 1
    on_clockwise:
      then:
        - lambda: 'id(knob_raw_pending)++;'
    on_anticlockwise:
      then:
        - lambda: 'id(knob_raw_pending)--;'

# ================= INTERVALS =================
interval:
  # Every click becomes exactly one step, in the direction turned. Nothing is
  # thrown away while spinning and nothing keeps replaying after you stop.
  - interval: 20ms
    then:
      - lambda: |-
          static uint32_t woke_ms = 0;
          static bool woke = false;
          static uint32_t last_seek_ms = 0;
          static int seek_pending = 0;
          const int p = id(current_page);
          const uint32_t now = millis();
          int raw = id(knob_raw_pending);
          id(knob_raw_pending) = 0;

          // The spin that wakes the screen shouldn't also move the menu.
          if (woke && now - woke_ms < 400) raw = 0;
          else woke = false;

          if (p != 10) seek_pending = 0;
          if (p == 10) {
            // Seeking sends an ADB command, so bundle the clicks into at most
            // one command every 150 ms (knob_step sends up to 8 key presses).
            if ((raw > 0 && seek_pending < 0) || (raw < 0 && seek_pending > 0)) seek_pending = 0;
            seek_pending += raw;
            if (seek_pending == 0 || now - last_seek_ms < 150) return;
            last_seek_ms = now;
            raw = seek_pending;
            seek_pending = 0;
          }
          if (raw == 0) return;

          if (p == 7) {
            woke = true;
            woke_ms = now;
          }
          id(knob_step)->execute(raw);

  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if ((millis() - id(last_user_touch)) < 20000) return false;
              int p = id(current_page);
              if (p == 7 || p == 10 || p == 11 || p == 13) return false;
              bool music = id(ha_music_state).state == "playing";
              bool tv = id(ha_tv_state).state == "playing"
                     && id(ha_tv_app_name).state != "Home Assistant Lovelace";
              if (music && p == 2) return false;
              return music || tv;
          then:
            - if:
                condition:
                  lambda: 'return id(ha_music_state).state == "playing";'
                then:
                  - lvgl.page.show:
                      id: music_now_playing_page
                      animation: OVER_BOTTOM
                      time: 240ms
                else:
                  - lvgl.page.show:
                      id: tv_now_playing_page
                      animation: OVER_BOTTOM
                      time: 240ms
            - script.execute: screen_idle_timer

# ================= BINARY SENSORS =================
binary_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: light.living_room_main_lights
    internal: true
    on_press:
      - lambda: 'id(lights_on) = true;'
    on_release:
      - lambda: 'id(lights_on) = false;'

  - platform: gpio
    id: encoder_button
    name: "Encoder Button"
    pin:
      pcf8574: pcf
      number: 5
      mode:
        input: true
      inverted: true
    on_press:
      - lambda: 'id(last_user_touch) = millis();'
      - if:
          condition:
            lambda: 'return id(current_page) == 7;'
          then:
            - lambda: 'id(wake_consumed) = true;'
            - script.execute: wake_from_clock
          else:
            - lambda: 'id(long_press_fired) = false;'
            - script.execute: screen_idle_timer
            - script.execute: encoder_hold_timer
    on_release:
      - script.stop: encoder_hold_timer
      - if:
          condition:
            lambda: 'return id(wake_consumed) || id(long_press_fired);'
          then:
            - lambda: 'id(wake_consumed) = false; id(long_press_fired) = false;'
          else:
            # ---- MAIN MENU CLICK ----
            - if:
                condition:
                  lambda: 'return id(current_page) == 0;'
                then:
                  - if:
                      condition:
                        lambda: 'return id(menu_index) == 0;'
                      then:
                        - lvgl.page.show: { id: music_now_playing_page, animation: OVER_LEFT, time: 240ms }
                  - if:
                      condition:
                        lambda: 'return id(menu_index) == 1;'
                      then:
                        - lvgl.page.show: { id: tv_menu_page, animation: OVER_LEFT, time: 240ms }
                  - if:
                      condition:
                        lambda: 'return id(menu_index) == 2;'
                      then:
                        - lvgl.page.show: { id: lights_menu_page, animation: OVER_LEFT, time: 240ms }
                  - if:
                      condition:
                        lambda: 'return id(menu_index) == 3;'
                      then:
                        - lvgl.page.show: { id: thermostat_page, animation: OVER_LEFT, time: 240ms }
                  - if:
                      condition:
                        lambda: 'return id(menu_index) == 4;'
                      then:
