          value: !lambda 'return id(brightness_value);'
      - lvgl.label.update:
          id: thermostat_target_label
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.0f\xc2\xb0", id(thermostat_target));
            return buf;

  - id: music_vol_step
    mode: queued
    max_runs: 32
    parameters:
      delta: int
    then:
      - lambda: |-
          uint32_t now = millis();
          int before = id(volume_value);
          int v = before + delta;
          if (v > 100) v = 100;
          if (v < 0) v = 0;
          id(volume_value) = v;
          id(knob_vol_ms) = now;
      - lvgl.label.update:
          id: volume_display
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(volume_value));
            return buf;
      - lvgl.arc.update:
          id: volume_arc
          value: !lambda 'return id(volume_value);'
      - if:
          condition:
            not:
              script.is_running: music_vol_send
          then:
            - script.execute: music_vol_send

