                              brightness_pct: !lambda 'return id(brightness_value);'
                      else:
                        - homeassistant.service:
                            service: light.turn_off
                            data:
                              entity_id: light.living_room_main_lights
            # ---- ACCENT PAGE: toggle group ----
            - if:
                condition:
                  lambda: 'return id(current_page) == 14;'
                then:
                  - lambda: 'id(accent_on) = !id(accent_on);'
                  - if:
                      condition:
                        lambda: 'return id(accent_on);'
                      then:
