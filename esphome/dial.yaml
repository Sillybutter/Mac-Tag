            x: 0
            y: 0
            width: 430
            height: 430
            radius: 215
            clickable: false
            bg_color: 0x1C1C1E
            bg_grad_color: 0x121214
            bg_grad_dir: VER
            border_width: 2
            border_color: 0x3A3A3C
            shadow_width: 0
        - label: { id: thermostat_current_label, text: "--", align: CENTER, x: 0, y: -85, text_font: montserrat_regular_20, text_color: 0x9E9EA4 }
        - label: { id: thermostat_target_label, text: "--", align: CENTER, x: 0, y: -5, text_font: montserrat_extralight_96, text_color: 0xE8EAED }
        - label: { id: thermostat_action_label, text: "--", align: CENTER, x: 0, y: 60, text_font: montserrat_medium_22, text_color: 0x8E8E93 }
