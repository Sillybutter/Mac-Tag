  - id: knob_debounce
    mode: restart
    then:
      - lambda: 'id(knob_active) = true;'
      - delay: 10s
      - lambda: |-
          id(knob_active) = false;
          int bd = id(ha_brightness_raw) - id(brightness_value);
          if (bd < 0) bd = -bd;
          if (id(ha_brightness_raw) >= 0 &&
              (int32_t)(id(ha_bri_ms) - id(knob_bri_ms)) > 0 && bd > 1) {
            id(brightness_value) = id(ha_brightness_raw);
          }
          if (id(ha_therm_target_raw) > -999.0f &&
              (int32_t)(id(ha_therm_ms) - id(knob_therm_ms)) > 0) {
            id(thermostat_target) = id(ha_therm_target_raw);
          }
      - lvgl.label.update:
          id: volume_display
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(volume_value));
            return buf;
      - lvgl.arc.update:
          id: volume_arc
          value: !lambda 'return id(volume_value);'
      - lvgl.label.update:
          id: brightness_value_label
          text: !lambda |-
