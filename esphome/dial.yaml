                              entity_id: light.living_room_art_light, light.mantel_lights_2, light.speaker_light, light.slat_wall_3, light.slat_wall_light_2, light.wall_slat_light_1, light.uplighter_floor_lamp, light.living_room_plant_ligh, light.couch_lights, light.gold_lamp
            # ---- MUSIC VOLUME PAGE: back ----
            - if:
                condition: { lambda: 'return id(current_page) == 2;' }
                then: [ lvgl.page.show: { id: music_now_playing_page, animation: OVER_LEFT, time: 240ms } ]
