            - if:
                condition: { lambda: 'return id(current_page) == 11;' }
                then:
                  - homeassistant.service:
                      service: media_player.media_play_pause
                      data: { entity_id: media_player.living_room_speakers_2 }
            # ---- THERMOSTAT PAGE: back ----
            - if:
                condition: { lambda: 'return id(current_page) == 3;' }
                then:
                  - lvgl.page.show: { id: main_menu_page, animation: OVER_LEFT, time: 240ms }
                  - lambda: 'id(current_page) = 0;'
            # ---- SCENES PAGE: activate ----
            - if:
                condition: { lambda: 'return id(current_page) == 4;' }
                then:
                  - script.execute: activate_scene
                  - lvgl.label.update: { id: scene_action_label, text: "Activated!", text_color: 0xF48FB1 }
                  - delay: 1500ms
                  - lvgl.label.update: { id: scene_action_label, text: "Press to set", text_color: 0x9E9EA4 }
            # ---- TV VOLUME PAGE: back ----
            - if:
                condition: { lambda: 'return id(current_page) == 9;' }
                then: [ lvgl.page.show: { id: tv_menu_page, animation: OVER_LEFT, time: 240ms } ]
            # ---- TV NOW PLAYING: play/pause ----
            - if:
                condition: { lambda: 'return id(current_page) == 10;' }
                then:
                  - homeassistant.service:
                      service: media_player.media_play_pause
                      data: { entity_id: media_player.android_tv_192_168_4_35 }
            # ---- SLEEP TIMER: start / cancel ----
            - if:
                condition: { lambda: 'return id(current_page) == 12;' }
                then:
                  - if:
                      condition: { lambda: 'return id(sleep_active);' }
                      then:
                        - script.stop: sleep_timer_run
                        - lambda: 'id(sleep_active) = false; id(sleep_minutes) = 0;'
                        - script.execute: sleep_update_ui
                        - lvgl.label.update: { id: clock_sleep_label, text: "" }
                      else:
                        - if:
                            condition: { lambda: 'return id(sleep_minutes) > 0;' }
                            then:
                              - lambda: 'id(sleep_active) = true;'
                              - script.execute: sleep_timer_run
                              - script.execute: sleep_update_ui
            # ---- PLAYLISTS: play selected ----
            - if:
                condition: { lambda: 'return id(current_page) == 15;' }
                then:
                  - homeassistant.service:
                      service: music_assistant.play_media
                      data:
                        entity_id: media_player.living_room_speakers_2
                        media_type: playlist
                        enqueue: replace
                      data_template:
                        media_id: !lambda 'return std::string(DIAL_PLAYLIST_URIS[id(playlist_index)]);'
                  - script.execute: flash_playlist_hint
            # ---- CHILL OUT: play selected ----
            - if:
                condition: { lambda: 'return id(current_page) == 17;' }
                then:
                  - homeassistant.service:
                      service: input_boolean.turn_on
                      data: { entity_id: input_boolean.chill_out_active }
                  - homeassistant.service:
                      service: music_assistant.play_media
                      data:
                        entity_id: media_player.living_room_speakers_2
                        enqueue: replace
                      data_template:
                        media_id: !lambda 'return std::string(DIAL_CHILL_URIS[id(chill_index)]);'
                        media_type: !lambda 'return std::string(DIAL_CHILL_TYPES[id(chill_index)]);'
                  - script.execute: flash_chill_hint
            # ---- PERSON ALERT: dismiss ----
            - if:
                condition: { lambda: 'return id(current_page) == 13;' }
                then:
                  - script.stop: alert_auto_dismiss
                  - script.execute: wake_from_clock

