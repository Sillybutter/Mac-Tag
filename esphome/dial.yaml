# ================= LVGL =================
lvgl:
  displays:
    - rgb_panel
  touchscreens:
    - my_touchscreen
  default_font: montserrat_regular_20
  disp_bg_color: 0x000000
  bg_color: 0x000000
  scroll_on_focus: false
  page_wrap: false

  theme:
    button:
      radius: 24
      border_width: 0
      bg_color: 0x1C1C1E
      bg_grad_color: 0x1C1C1E
      shadow_width: 0
    slider:
      bg_color: 0x2C2C2E
      bg_grad_color: 0x2C2C2E
      border_width: 0
      radius: 8
      indicator:
        bg_color: 0x8AB4F8
        bg_grad_color: 0x8AB4F8
        bg_grad_dir: HOR
        radius: 8

  pages:
    # ========== SCREENSAVER (CLOCK) ==========
    - id: clock_page
      skip: true
      scrollable: false
      bg_color: 0x000000
      on_load:
        - lambda: 'id(current_page) = 7;'
