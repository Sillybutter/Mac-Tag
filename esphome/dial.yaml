# ================= SCRIPTS =================
script:
  # ================= UNIFIED ROTARY STEP ENGINE =================
  - id: knob_step
    mode: queued
    max_runs: 16
    parameters:
      steps: int
    then:
      - lambda: |-
          id(last_user_touch) = millis();
          int p = id(current_page);

          if (p == 7) {
            id(wake_from_clock)->execute();
            return;
          }

          id(screen_idle_timer)->execute();
          id(knob_debounce)->execute();

          // ---- MAIN MENU (Page 0) ----
          if (p == 0) {
            id(menu_index) = (id(menu_index) + steps) % 5;
            if (id(menu_index) < 0) id(menu_index) += 5;
            id(update_menu_ui)->execute();
          }
          // ---- LIGHTS MENU (Page 1) ----
          else if (p == 1) {
            id(lights_menu_index) = (id(lights_menu_index) + steps) % 7;
            if (id(lights_menu_index) < 0) id(lights_menu_index) += 7;
            id(update_lights_menu_ui)->execute();
          }
          // ---- MUSIC VOLUME (Page 2 & 11) ----
          else if (p == 2 || p == 11) {
            id(music_vol_step)->execute(steps * 2);
          }
          // ---- THERMOSTAT (Page 3) ----
          else if (p == 3) {
            float nv = id(thermostat_target) + (float)steps * 1.0f;
            if (nv > 90.0f) nv = 90.0f;
            if (nv < 55.0f) nv = 55.0f;
            id(thermostat_target) = nv;
            id(knob_therm_ms) = millis();
            id(thermostat_send)->execute();
          }
          // ---- SCENES (Page 4) ----
          else if (p == 4) {
            id(scene_ui_index) = (id(scene_ui_index) + steps) % 5;
            if (id(scene_ui_index) < 0) id(scene_ui_index) += 5;
            id(update_scene_ui)->execute();
          }
          // ---- OVERHEAD BRIGHTNESS (Page 5) ----
          else if (p == 5) {
            int nv = id(brightness_value) + (steps * 5);
            if (nv > 100) nv = 100;
            if (nv < 0) nv = 0;
            id(brightness_value) = nv;
            id(knob_bri_ms) = millis();
            id(brightness_send)->execute();
          }
          // ---- TV SUB-MENU (Page 6) ----
          else if (p == 6) {
            id(tv_menu_index) = (id(tv_menu_index) + steps) % 8;
            if (id(tv_menu_index) < 0) id(tv_menu_index) += 8;
            id(update_tv_menu_ui)->execute();
          }
          // ---- SPOTLIGHTS (Page 8) ----
          else if (p == 8) {
            id(spotlights_menu_index) = (id(spotlights_menu_index) + steps) % 11;
            if (id(spotlights_menu_index) < 0) id(spotlights_menu_index) += 11;
            id(update_spotlights_menu_ui)->execute();
          }
          // ---- TV VOLUME (Page 9) ----
          else if (p == 9) {
            // One IR press per click, spaced out by tv_vol_pump so none get
            // dropped. Turning back cancels presses still waiting to be sent.
            int q = id(tv_vol_steps);
            if ((steps > 0 && q < 0) || (steps < 0 && q > 0)) q = 0;
            q += steps;
            if (q > 10) q = 10;
            if (q < -10) q = -10;
            id(tv_vol_steps) = q;
            if (!id(tv_vol_pump)->is_running()) id(tv_vol_pump)->execute();
          }
          // ---- TV SEEK / FAST FORWARD (Page 10) ----
          else if (p == 10) {
            // steps is every click from the last 150 ms, so spinning faster
            // seeks further: one key press per click, up to 8 per command.
            int n = steps < 0 ? -steps : steps;
            id(tv_seek_multiplier) = n > 8 ? 8 : n;

            if (steps > 0) id(tv_seek_forward)->execute();
            else if (steps < 0) id(tv_seek_rewind)->execute();
          }
          // ---- SLEEP TIMER (Page 12) ----
          else if (p == 12) {
            if (!id(sleep_active)) {
              int nv = id(sleep_minutes) + (steps * 5);
              if (nv > 120) nv = 120;
              if (nv < 0) nv = 0;
              id(sleep_minutes) = nv;
              id(sleep_update_ui)->execute();
            }
          }
          // ---- ACCENT LIGHTS BRIGHTNESS (Page 14) ----
          else if (p == 14) {
            int nv = id(accent_brightness_value) + (steps * 5);
            if (nv > 100) nv = 100;
            if (nv < 0) nv = 0;
            id(accent_brightness_value) = nv;
            id(accent_send_ui_and_debounce)->execute();
          }
          // ---- PLAYLISTS (Page 15) ----
          else if (p == 15) {
            id(playlist_index) = (id(playlist_index) + steps) % DIAL_PLAYLIST_COUNT;
            if (id(playlist_index) < 0) id(playlist_index) += DIAL_PLAYLIST_COUNT;
            id(update_playlist_ui)->execute();
          }
          // ---- CHILL OUT (Page 17) ----
          else if (p == 17) {
            id(chill_index) = (id(chill_index) + steps) % DIAL_CHILL_COUNT;
            if (id(chill_index) < 0) id(chill_index) += DIAL_CHILL_COUNT;
            id(update_chill_ui)->execute();
          }

  # --- TV Volume Step Triggers ---
  - id: tv_vol_up_fire
    then:
      - lvgl.label.update: { id: tv_vol_direction, text: "VOL +" }
      - homeassistant.service:
          service: button.press
          data: { entity_id: button.lnlinkha_4101599dceac00009aa47143435d }
      - script.execute: tv_vol_hint_reset

  - id: tv_vol_down_fire
    then:
      - lvgl.label.update: { id: tv_vol_direction, text: "VOL -" }
      - homeassistant.service:
          service: button.press
          data: { entity_id: button.lnlinkha_4101599dceac00009aa47143435d_2 }
      - script.execute: tv_vol_hint_reset

  # --- TV Volume: send queued clicks one IR press at a time ---
  - id: tv_vol_pump
    mode: single
    then:
      - while:
          condition:
            lambda: 'return id(tv_vol_steps) != 0 && id(current_page) == 9;'
          then:
            - if:
                condition:
                  lambda: 'return id(tv_vol_steps) > 0;'
                then:
                  - lambda: 'id(tv_vol_steps) -= 1;'
                  - script.execute: tv_vol_up_fire
                else:
                  - lambda: 'id(tv_vol_steps) += 1;'
                  - script.execute: tv_vol_down_fire
            - delay: 120ms
      - lambda: 'id(tv_vol_steps) = 0;'

  # --- TV Seek Triggers ---
  - id: tv_seek_forward
    then:
      - homeassistant.service:
          service: androidtv.adb_command
          data: { entity_id: media_player.android_tv_192_168_4_35 }
          data_template:
            command: !lambda |-
              std::string cmd = "input keyevent";
              for (int i = 0; i < id(tv_seek_multiplier); i++) cmd += " 90";
              return cmd;
      - lvgl.label.update:
          id: tv_seek_hint
          text: !lambda |-
            static char buf[24];
            if (id(tv_seek_multiplier) > 1) snprintf(buf, sizeof(buf), "Fast Forward  >> x%d", id(tv_seek_multiplier));
            else snprintf(buf, sizeof(buf), "Fast Forward  >>");
            return buf;
          text_color: 0x81C995
      - script.execute: seek_hint_reset
      - script.execute: reset_seek_ramp

  - id: tv_seek_rewind
    then:
      - homeassistant.service:
          service: androidtv.adb_command
          data: { entity_id: media_player.android_tv_192_168_4_35 }
          data_template:
            command: !lambda |-
              std::string cmd = "input keyevent";
              for (int i = 0; i < id(tv_seek_multiplier); i++) cmd += " 89";
              return cmd;
      - lvgl.label.update:
          id: tv_seek_hint
          text: !lambda |-
            static char buf[24];
            if (id(tv_seek_multiplier) > 1) snprintf(buf, sizeof(buf), "<< x%d  Rewind", id(tv_seek_multiplier));
            else snprintf(buf, sizeof(buf), "<<  Rewind");
            return buf;
          text_color: 0x81C995
      - script.execute: seek_hint_reset
      - script.execute: reset_seek_ramp

