            if (c == "sunny") cond = "Sunny";
            else if (c == "clear-night") cond = "Clear";
            else if (c == "partlycloudy") cond = "Partly cloudy";
            else if (c == "cloudy") cond = "Cloudy";
            else if (c == "rainy") cond = "Rain";
            else if (c == "pouring") cond = "Heavy rain";
            else if (c == "lightning" || c == "lightning-rainy") cond = "Storms";
            else if (c == "snowy" || c == "snowy-rainy") cond = "Snow";
            else if (c == "fog") cond = "Fog";
            else if (c == "windy" || c == "windy-variant") cond = "Windy";
            else if (c == "hail") cond = "Hail";
            else if (c == "exceptional") cond = "Severe";
            float out = id(ha_weather_temp).state;
            if (!isnan(out) && cond[0] != 0) {
              snprintf(buf, sizeof(buf), "%.0f\xc2\xb0 %s   \xc2\xb7   Inside %.0f\xc2\xb0", out, cond, id(thermostat_current));
